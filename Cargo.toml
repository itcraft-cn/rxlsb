[package]
name = "rxlsb"
version = "0.4.0-dev" # managed by updgitver
edition = "2021"
authors = ["HellyGuo <hellyguo@foxmail.com>"]
exclude = ["tests", "test_data", "benches", "examples", ".vscode"]
homepage = "https://itcraft.cn/rxlsb/"
repository = "https://github.com/itcraft-cn/rxlsb"
license = "Apache-2.0"
readme = "README.md"
description = "Pure Rust XLSB (Excel Binary Workbook) reader/writer library"
categories = ["text-processing"]
documentation = "https://docs.rs/crate/rxlsb/latest"
keywords = ["wps", "office", "spreadsheet", "excel",  "xlsb"]

[dependencies]
zip = "0.6"
bytes = "1.5"
thiserror = "1.0"
chrono = "0.4"
once_cell = "1.19"
# 可选：启用 C 版 zlib-ng 作为 flate2 的 deflate 后端。
# 默认使用纯 Rust（miniz_oxide）；开启 `zlib-ng` feature 可获得更高压缩吞吐。
flate2 = { version = "1", optional = true }

[features]
default = []
zlib-ng = ["dep:flate2", "flate2/zlib-ng"]

[dev-dependencies]
tempfile = "3.8"
